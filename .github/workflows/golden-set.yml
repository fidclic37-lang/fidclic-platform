# Golden set de FidClic IA (user, 2026-11-03) — ~250 known questions asked to
# the REAL model on demo shops (never a real merchant), graded at 100 %: one
# failed question = a red check.
#
# Runs only when asked, because each run costs real money (≈ 1–3 €, stopped at
# GOLDEN_MAX_EUR): a pull request with the « ai » label, or « Lancer » in
# Super admin › FIDCLIC AI › Golden set (workflow_dispatch). The free layer
# (api/tests/test_golden_set.py) runs on every PR with the other API tests.
#
# Needs, in the repository's Actions secrets/variables: ANTHROPIC_API_KEY (or
# GROQ_API_KEY / NVIDIA_API_KEY) and, to test the production model,
# vars.LLM_PROVIDER / vars.LLM_MODEL as set on Vercel.
name: Golden set

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ai')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Ask the real model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GOLDEN_MAX_EUR: ${{ vars.GOLDEN_MAX_EUR || '5' }}
        run: python3 scripts/golden_run.py --out golden-report
      - name: Summary
        if: always()
        run: cat golden-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report
          path: golden-report/golden-report.json
          retention-days: 90
