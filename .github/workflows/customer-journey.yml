# Customer journey — a real browser walks what a customer does (signup, the
# card, the Wallet tiles, a friend's QR, a card given back) on every pull
# request, against the local server with in-memory demo data. A red check
# means a customer would hit an error page: do not merge.
# (2026-10-09: #176 shipped a « Carte introuvable » behind every Wallet tile
# while all API tests were green.)
# (The workflow keeps its name: a branch rule may require « Customer journey ».
# It now carries two checks — « api » and « e2e ».)
name: Customer journey

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The API's own tests — ~135 standalone scripts under api/tests. They had no
  # check here, so a red one reached main unseen twice in two days: the caisse
  # endpoints outside the permissions model (#286), and the geofence check left
  # behind when the Wallet pass started asking about the plan (#310). Both were
  # found by hand, days later.
  api:
    runs-on: ubuntu-latest
    # 30, not 20 (2026-10-28): the files run one after the other and took
    # 11–18 min on 28/10 depending on the runner; #392 was cut at 20 with every
    # file green
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt uvicorn
      - name: Run the API tests
        run: python3 scripts/run_api_tests.py

  e2e:
    runs-on: ubuntu-latest
    # 35, not 20 (2026-10-22): the tests take ~4 min, but a slow runner once
    # spent 17 min installing the browser and the job was cut at 20
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt uvicorn

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vite build
      # the browser kept between runs: only the system libraries are installed
      # each time (a fresh download is what made a run slow)
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # A stuck download or apt mirror once held the job until it was cancelled
      # at 35 min, without a single test run (#361, 2026-10-23). Each attempt
      # now has 7 min, and a stuck one is retried — up to 3 times.
      # 2026-11-11 (#489): the runner could not resolve archive.ubuntu.com for
      # 20 minutes — apt hung three times and no test ran. The browser itself
      # comes from Playwright's own CDN (no apt); the system libraries are
      # asked of apt but no longer required: GitHub's image already carries
      # Chrome's. What decides is whether Chromium actually starts.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install chromium && exit 0
            echo "::warning::browser download attempt $i failed or hung — retrying"; sleep 15
          done
          exit 1
      - name: System libraries (best effort)
        run: |
          for i in 1 2; do
            timeout 180 npx playwright install-deps chromium && exit 0
            echo "::warning::apt attempt $i failed or hung (Ubuntu mirrors) — retrying"; sleep 10
          done
          echo "::warning::apt unreachable — going on with the libraries already on the runner"
      - name: Chromium starts
        run: node -e "require('@playwright/test').chromium.launch().then(b => b.close()).then(() => console.log('chromium OK'))"

      - name: Walk the customer journey
        run: npx playwright test
        env:
          CI: 'true'
          PYTHON: python

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: customer-journey-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
