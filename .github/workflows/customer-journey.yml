# Customer journey — a real browser walks what a customer does (signup, the
# card, the Wallet tiles, a friend's QR, a card given back) on every pull
# request, against the local server with in-memory demo data. A red check
# means a customer would hit an error page: do not merge.
# (2026-10-09: #176 shipped a « Carte introuvable » behind every Wallet tile
# while all API tests were green.)
# (The workflow keeps its name: a branch rule may require « Customer journey ».
# It now carries two checks — « api » and « e2e ».)
name: Customer journey

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The API's own tests — ~135 standalone scripts under api/tests. They had no
  # check here, so a red one reached main unseen twice in two days: the caisse
  # endpoints outside the permissions model (#286), and the geofence check left
  # behind when the Wallet pass started asking about the plan (#310). Both were
  # found by hand, days later.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt uvicorn
      - name: Run the API tests
        run: python3 scripts/run_api_tests.py

  e2e:
    runs-on: ubuntu-latest
    # 35, not 20 (2026-10-22): the tests take ~4 min, but a slow runner once
    # spent 17 min installing the browser and the job was cut at 20
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt uvicorn

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vite build
      # the browser kept between runs: only the system libraries are installed
      # each time (a fresh download is what made a run slow)
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Walk the customer journey
        run: npx playwright test
        env:
          CI: 'true'
          PYTHON: python

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: customer-journey-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
